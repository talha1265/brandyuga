<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Rocket Body Gradient -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f1f5f9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e2e8f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cbd5e1;stop-opacity:1" />
    </linearGradient>
    <!-- Window Gradient -->
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <!-- Fin Gradient -->
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b91c1c;stop-opacity:1" />
    </linearGradient>
    <!-- Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fef08a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:0" />
    </linearGradient>
    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" />
      <feOffset dx="0" dy="20" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(0, 20)" filter="url(#dropShadow)">
    <!-- Left Fin -->
    <path d="M120 350 L80 420 L160 400 Z" fill="url(#finGrad)" />
    <!-- Right Fin -->
    <path d="M392 350 L432 420 L352 400 Z" fill="url(#finGrad)" />
    <!-- Center Fin -->
    <path d="M256 350 L256 430 L256 380 Z" stroke="#991b1b" stroke-width="2" />

    <!-- Rocket Body -->
    <ellipse cx="256" cy="250" rx="100" ry="200" fill="url(#bodyGrad)" />
    
    <!-- Window Border -->
    <circle cx="256" cy="200" r="45" fill="#94a3b8" />
    <!-- Window Glass -->
    <circle cx="256" cy="200" r="35" fill="url(#windowGrad)" />
    <!-- Window Reflection -->
    <circle cx="270" cy="190" r="10" fill="white" opacity="0.4" />

    <!-- Main Fin (Bottom) -->
    <path d="M256 420 L220 450 L292 450 Z" fill="#b91c1c" />
  </g>

  <!-- Flame -->
  <path d="M256 460 Q 280 500 256 512 Q 232 500 256 460" fill="url(#flameGrad)">
    <animate attributeName="d" 
             values="M256 460 Q 280 500 256 512 Q 232 500 256 460;
                     M256 460 Q 290 530 256 550 Q 220 530 256 460;
                     M256 460 Q 280 500 256 512 Q 232 500 256 460" 
             dur="1s" repeatCount="indefinite" />
  </path>
  
  <!-- Clouds/Smoke (Simple Bubbles) -->
  <circle cx="150" cy="450" r="30" fill="white" opacity="0.8" />
  <circle cx="362" cy="480" r="20" fill="white" opacity="0.6" />
  <circle cx="400" cy="420" r="15" fill="white" opacity="0.4" />
</svg>
